name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photoshowcase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: photoshowcase_test

    steps:
      - uses: actions/checkout@v6

      - name: Verify pre-commit fallback is intact
        run: ./.husky/check-fallback-committed.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # Task #32. Regenerates schema.graphql + src/lib/graphql/generated/ and
      # fails if either differs from what is committed.
      #
      # DELIBERATELY BEFORE Typecheck, not after: #32's owner decision makes
      # `bun run typecheck` the load-bearing guard for a query that drifted
      # from the schema, and it can only be that if the generated types it
      # reads are current. Stale generated output would let Typecheck pass for
      # the wrong reason. Running this first means that by the time Typecheck
      # speaks, its input is known current.
      #
      # NOTE, because it is mildly surprising when run locally: this
      # REGENERATES IN PLACE and then diffs, so it mutates the working tree.
      # Harmless here, and harmless to the steps below — if it passes, the tree
      # is byte-identical to the commit; if it fails, the job stops and nothing
      # below runs. Do not give this step `continue-on-error` or an `if:`, or
      # that second half stops being true and a later gate could measure
      # regenerated bytes instead of committed ones.
      - name: Codegen freshness
        run: bun run codegen:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
