name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to main)"
        required: false
        default: "main"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      APP_ROOT: /srv/photoshowcase
      # Only `deploy` can write here (0700 under deploy's own 0750 home) --
      # unlike world-writable /tmp, no other local principal on this shared
      # droplet can pre-create or symlink this path out from under us. See
      # the "Install systemd unit" step.
      UNIT_STAGING_DIR: /home/deploy/staging

    steps:
      - name: Resolve target ref
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 1

      - name: Resolve SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone artifact
        run: bun run build

      - name: Package release tarball
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          STAGE=release-stage
          mkdir -p "$STAGE"
          cp -r .next/standalone/. "$STAGE"/
          mkdir -p "$STAGE/.next"
          cp -r .next/static "$STAGE/.next/static"
          if [ -d public ]; then cp -r public "$STAGE/public"; fi
          # Next's standalone tracing only emits a package under
          # node_modules/ for code paths reachable from an app ROUTE; it
          # inlines/tree-shakes the rest into the compiled `.next/server`
          # chunks, so it never leaves a real, `require`-able package
          # directory behind for something else to reuse. Any bare npm
          # import used ONLY by a script (or by a src/lib/ module a script
          # pulls in) therefore needs its package hand-overlaid here, same as
          # the app's own route bundles do not help it. Confirmed hand-overlaid
          # so far, and why each is needed:
          #   - drizzle-orm, postgres: scripts/migrate-prod.ts is the only
          #     caller of drizzle-orm/postgres-js/migrator anywhere in the
          #     codebase; no route reaches that import path.
          #   - zod (task #104 review, blocker 1): src/lib/env.ts imports it
          #     directly, and every route that reaches env.ts does so through
          #     Next's bundler, which inlines zod rather than leaving it as a
          #     package -- so the FIRST time anything needs a real,
          #     `require`-able `zod` package on disk is a raw script run via
          #     plain `bun run`. Verified on the real droplet:
          #     node_modules there is exactly client-only, detect-libc,
          #     drizzle-orm, @img, @next, next, postgres, react, react-dom,
          #     semver, sharp, styled-jsx, @swc -- no zod, and no ancestor
          #     node_modules to fall back to either (this is a plain release
          #     dir, not a workspace). Without this line,
          #     backfill-display-derivatives.ts, check-r2.ts and
          #     check-resend.ts (all three import ../src/lib/env) die on
          #     import with "Cannot find package 'zod'".
          # This list is NOT self-maintaining the way scripts/ and src/lib/
          # below are -- a new script that imports a new bare npm package
          # needs a new line here. The "Verify ops script import graphs
          # resolve in the staged tarball" step further below exists
          # precisely to catch the day someone forgets, by actually trying to
          # resolve every ops script's import graph against this staged
          # output rather than trusting this comment block to stay accurate.
          cp -r node_modules/drizzle-orm "$STAGE/node_modules/drizzle-orm"
          cp -r node_modules/postgres "$STAGE/node_modules/postgres"
          cp -r node_modules/zod "$STAGE/node_modules/zod"
          if [ -d drizzle ]; then cp -r drizzle "$STAGE/drizzle"; fi
          # Ops scripts (task #104, fixing the class, not the instance): task
          # #104 found backfill-display-derivatives.ts invisible to this step,
          # because scripts were staged by an explicit allowlist -- one `cp`
          # per file -- and a new script needed a new line nobody remembered
          # to add. Adding that one line would only have fixed THIS script;
          # the next one dropped into scripts/ hits the identical gap. So:
          # overlay `scripts/` and `src/lib/` WHOLESALE instead of naming
          # files one by one. Every script committed under scripts/ now
          # reaches the droplet by construction, and so does every src/lib/
          # module it imports (the file-PRESENCE half of the gap #104 hit --
          # see the node_modules block above for the import-RESOLUTION half,
          # which presence alone does not cover, and which is exactly what
          # broke review round 1 of this task: scripts/ and src/lib/ were
          # both fully present and it still failed on a missing `zod`).
          #
          # rsync's --exclude, not `cp` + a separate `find -delete`: the
          # earlier shape copied every test file first and deleted them
          # afterward as a silent, easy-to-forget second step. Excluding at
          # copy time means a test file is never staged in the first place;
          # the assertion below is the loud backstop in case a future test
          # file naming convention (`*.spec.ts`, `*.test.tsx`, ...) isn't
          # covered by these patterns yet.
          rsync -a --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude='*.spec.tsx' \
            scripts/ "$STAGE/scripts/"
          mkdir -p "$STAGE/src"
          rsync -a --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude='*.spec.tsx' \
            src/lib/ "$STAGE/src/lib/"
          leaked_test_files=$(find "$STAGE/scripts" "$STAGE/src/lib" -type f \
            \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \))
          if [ -n "$leaked_test_files" ]; then
            echo "Test file(s) leaked into the staged release despite rsync's --exclude filters -- refusing to ship:"
            echo "$leaked_test_files"
            exit 1
          fi
          # r2.ts (pulled in by backfill-display-derivatives.ts) imports
          # src/lib/env.ts through the `@/` alias, unlike every other
          # overlaid module here, which uses relative imports. Bun resolves
          # `@/*` from tsconfig.json's `paths` at runtime the same way it
          # does under `bun dev` -- verified against this exact staged
          # layout: an identical `bun run` fails with "Cannot find module
          # '@/lib/env'" without this file, and resolves correctly with it.
          # The release dir had no tsconfig.json before now, so this import
          # would have failed on the droplet at runtime, not here at deploy
          # time -- the open question task #104 was asked to close before
          # shipping this script.
          cp tsconfig.json "$STAGE/tsconfig.json"
          mkdir -p "$STAGE/src/content"
          cp src/content/portfolio.ts "$STAGE/src/content/portfolio.ts"
          echo "$GIT_SHA" > "$STAGE/GIT_SHA"
          tar -czf release.tar.gz -C "$STAGE" .
          ls -lh release.tar.gz

      - name: Verify ops script import graphs resolve in the staged tarball
        run: |
          set -eu
          STAGE=release-stage
          # task #104 review, item 4: file PRESENCE (the rsync overlay above)
          # is necessary but not sufficient -- an ops script can be fully
          # present, under a fully present scripts/ and src/lib/, and still
          # fail at import time if a bare npm package somewhere in its
          # transitive graph was never traced by Next AND never hand-overlaid
          # above. That is exactly what shipped broken in review round 1:
          # `zod` was missing and nothing caught it before the droplet did.
          # File-presence and import-resolution are complementary checks,
          # not alternatives -- this step is the second one, and it is what
          # actually makes "a new script under scripts/ cannot silently fail
          # to reach the droplet" (task #104's acceptance criterion) true.
          #
          # For every package.json script whose command touches `scripts/`,
          # resolve its FULL import graph using `bun build`. `bun build`
          # performs the same module resolution `bun run` would without
          # executing a single line of the script's top-level code --
          # several of these scripts do real work (DB writes, R2 writes,
          # seeding) the instant they are imported, so actually running them
          # here is not an option.
          #
          # Resolved against an EXTRACTION of release.tar.gz in a mktemp dir
          # OUTSIDE $GITHUB_WORKSPACE, not against `$STAGE` in place -- round
          # 2 review, blocker 2: `$STAGE` (release-stage/) lives inside this
          # job's own checkout, right next to the `node_modules` that
          # `bun install` populated two steps ago (a FULL install, superset
          # of what the tarball ships). Bun's module resolution walks
          # upward from wherever `bun build` runs, so `cd release-stage &&
          # bun build ...` climbs past release-stage/node_modules (missing
          # zod, say) straight into the checkout's own node_modules (has
          # zod) and reports success -- mutation-proved: deleting zod from
          # $STAGE alone and re-running the OLD (in-place) form of this
          # check still printed "resolve cleanly" and exited 0. The literal
          # bug this step exists to catch, undetected by the step meant to
          # catch it, for the identical "a real node_modules is reachable
          # by walking up from where bun resolves" reason as round 1's
          # `zod` gap itself and round 2's first (contaminated) local
          # simulation of this very check. Extracting the actual tarball
          # into a directory with no ancestor `node_modules` removes that
          # escape hatch, and has the added benefit of verifying what
          # actually SHIPS (the tarball), not what was staged before
          # tar'ing it up.
          #
          # NOT covered by this or any static check: a script that reaches
          # a bare package only through a runtime-conditional
          # `require()`/dynamic `import()` rather than a static import --
          # `bun build`'s resolution is static. Nothing under scripts/ does
          # that today; if one ever does, this step's silence on that one
          # import is a known, accepted gap, not a guarantee.
          mapfile -t ops_scripts < <(jq -r '.scripts[]' package.json | grep -oE 'scripts/[A-Za-z0-9_.-]+\.ts' | sort -u)
          if [ "${#ops_scripts[@]}" -eq 0 ]; then
            echo "No package.json script references scripts/*.ts -- this check would have nothing to verify, which is itself a surprise worth failing loudly on rather than silently passing."
            exit 1
          fi
          resolve_root="$(mktemp -d)"
          tar -xzf release.tar.gz -C "$resolve_root"
          resolve_out="$(mktemp -d)"
          failed=0
          for rel in "${ops_scripts[@]}"; do
            if [ ! -f "$STAGE/$rel" ]; then
              echo "MISSING: package.json references $rel but it is not staged at $STAGE/$rel"
              failed=1
              continue
            fi
            echo "resolving $rel ..."
            if ! (cd "$resolve_root" && bun build "$rel" --target=bun --outdir="$resolve_out"); then
              echo "IMPORT GRAPH BROKEN: $rel would fail to even import on the droplet -- see the bun build error above. Overlay the missing package's node_modules folder in the 'Package release tarball' step."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All ops scripts referenced by package.json resolve cleanly against the extracted release tarball."

      - name: Setup SSH
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload tarball
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/release-$GIT_SHA.tar.gz"

      - name: Extract release + write release.env
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          TARBALL="/tmp/release-$GIT_SHA.tar.gz"
          ENV_FILE="$RELEASE_DIR/release.env"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u photoshowcase install -d -m 0755 '$RELEASE_DIR'
            sudo -n -u photoshowcase tar -xzf '$TARBALL' -C '$RELEASE_DIR'
            rm -f '$TARBALL'
            printf 'GIT_SHA=%s\nAPP_ENV=production\n' '$GIT_SHA' | sudo -n -u photoshowcase tee '$ENV_FILE' >/dev/null
            sudo -n -u photoshowcase chmod 0640 '$ENV_FILE'
            # Next's image optimizer writes its on-disk cache under
            # <distDir>/cache (.next/cache) at runtime, but the release dir is
            # read-only to the running service by design (ProtectSystem=strict
            # in photoshowcase.service). Point .next/cache at the
            # systemd-managed CacheDirectory= (/var/cache/photoshowcase, which
            # IS writable under that hardening) instead of leaving it inside
            # the immutable release. Done here, at deploy time, because the
            # deploy user still has a normal writable view of the release dir
            # -- the sandbox only applies to the running photoshowcase.service
            # process, not to this extraction step. See task #99.
            sudo -n -u photoshowcase install -d -m 0755 '$RELEASE_DIR/.next'
            sudo -n -u photoshowcase ln -sfn /var/cache/photoshowcase '$RELEASE_DIR/.next/cache'
          "

      - name: Run migrations
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u photoshowcase /opt/bun/bin/bun scripts/migrate-prod.ts
          "

      - name: Seed portfolio content
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          # Idempotent full resync of portfolio tables from the committed manifest.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u photoshowcase /opt/bun/bin/bun scripts/seed-prod.ts
          "

      - name: Seed session packages
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          # Idempotent — matches on package name, so re-running only updates
          # prices/quotas. Safe to run on every deploy; existing galleries keep
          # their frozen snapshot regardless of what this changes.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u photoshowcase /opt/bun/bin/bun scripts/seed-packages.ts
          "

      - name: Install systemd unit
        id: install-unit
        run: |
          set -eu
          # Ships infra/systemd/photoshowcase.service + daemon-reload on every
          # deploy instead of leaving that a documented manual SSH step
          # (infra/README.md previously said so). That gap meant a unit-level
          # fix (e.g. #99's CacheDirectory=) shipped inert until a human ran
          # `sudo install` + `daemon-reload` by hand. See task #102.
          #
          # This needs a sudoers grant the pipeline does not apply itself --
          # infra/sudoers/photoshowcase-unit-install. Be plain about what
          # that grant is: `deploy` already controls the ExecStart= a
          # root-owned unit runs and already holds `systemctl restart
          # photoshowcase.service`, so letting it write this one unit file
          # is root-equivalent for `deploy`, full stop. The literal
          # destination path bounds WHICH file gets written, not what a
          # hostile or buggy `deploy` could put in it -- narrow scoping does
          # not shrink the blast radius of a compromised or mistaken
          # `deploy`, only of a `deploy` that mistypes a path. The real
          # enforcement boundary is PR review of
          # infra/systemd/photoshowcase.service, branch protection on
          # `main`, custody of the DEPLOY_SSH_KEY secret, and who may
          # dispatch this workflow. It is also not a NEW escalation on this
          # shared droplet: findash-redis-provision already grants `deploy`
          # an equivalent root-equivalent pattern (installing a unit file as
          # root) plus a redis restart. See
          # infra/sudoers/photoshowcase-unit-install for the rule itself.
          #
          # Runs right before "Flip symlink + restart" (not immediately
          # after SSH setup, as an earlier version of this step did) so the
          # unit and the release flip together in the same narrow window,
          # and so a rollback can restore both -- see "Rollback on failure"
          # below, whose `if:` also triggers on THIS step (or "Verify
          # installed unit matches repo") failing, not only on the flip
          # having happened -- task #102 shipped without that and #112
          # found the gap: this step (or Verify) failing left the newly
          # installed unit in place with nothing to revert it, because the
          # rollback step's gate only checked whether the flip had run. See
          # "Rollback on failure" for the current, authoritative statement
          # of what is and is not covered -- don't duplicate that list here,
          # it drifts.
          # Deliberate trade, not an oversight: this now fails AFTER
          # migrations and seeding have already run against the new release,
          # not before. Unit/release skew is persistent host state that
          # outlives this job, whereas "the database is ahead of the
          # currently-running code" is a state this pipeline already reaches
          # at several earlier, pre-existing failure points (a failed seed
          # step, a failed health probe) with no dedicated rollback for the
          # data itself -- so this is not a new risk class, just this step
          # moving to join it.
          #
          # Staged into a directory only `deploy` can write
          # ($UNIT_STAGING_DIR, under deploy's own 0750-with-empty-group
          # home) rather than world-writable /tmp: an earlier version staged
          # into /tmp, which other local principals on this shared box have
          # a real (non-sandboxed) view of -- specifically the cron backup
          # jobs (running as findash, photoshowcase, zyeth; cron does not
          # apply PrivateTmp=) and an interactive shell as any of those
          # users. (The findash/photoshowcase/zyeth *services* themselves do
          # set PrivateTmp=true and were never the exposure.) They could
          # pre-create or symlink /tmp/photoshowcase.service and have their
          # bytes installed as root. See task #102 review.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 0700 '$UNIT_STAGING_DIR'"
          # Snapshot what is currently installed before overwriting it, so a
          # later rollback can restore it: daemon-reload below makes the NEW
          # unit definition active for any future restart -- including a
          # rollback's -- unless the old one is put back first. Plain
          # (non-sudo) read: unit files under /etc/systemd/system are
          # root:root 644 by default. Sentinel covers the first-ever install
          # (nothing to snapshot yet).
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat /etc/systemd/system/photoshowcase.service 2>/dev/null || echo __UNIT_ABSENT__' \
            > prev-unit-snapshot.txt
          # A transport failure on this scp is a plain, self-explanatory
          # error -- the remediation text below is specifically about the
          # sudoers grant the *next* command needs, so it isn't repeated
          # here.
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            infra/systemd/photoshowcase.service \
            "$DEPLOY_USER@$DEPLOY_HOST:$UNIT_STAGING_DIR/photoshowcase.service"
          if ! ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n install -m 0644 -o root -g root '$UNIT_STAGING_DIR/photoshowcase.service' /etc/systemd/system/photoshowcase.service
            rm -f '$UNIT_STAGING_DIR/photoshowcase.service'
            sudo -n systemctl daemon-reload
          "; then
            echo "Failed to install the systemd unit on the droplet."
            echo "Most likely cause: the deploy user does not have the sudoers grant this step needs."
            echo "The droplet owner must apply it once (see infra/sudoers/photoshowcase-unit-install):"
            echo "  sudo cp infra/sudoers/photoshowcase-unit-install /etc/sudoers.d/photoshowcase-unit-install"
            echo "  sudo chmod 0440 /etc/sudoers.d/photoshowcase-unit-install"
            echo "  sudo visudo -c"
            echo "This can also fail after the grant is applied, e.g. if 'install'"
            echo "succeeds but 'rm' or 'daemon-reload' does not -- that leaves the new"
            echo "unit file on disk but not yet reloaded. Re-run this deploy once the"
            echo "underlying failure is fixed; do not assume it is always sudoers."
            exit 1
          fi

      - name: Verify installed unit matches repo
        id: verify-unit
        run: |
          set -eu
          # This does NOT catch a unit hand-edited on the droplet during an
          # incident -- the previous step's install just overwrote any such
          # edit, so this step then compares repo against repo and always
          # passes. A hand-edited unit is silently reverted here, mid-
          # incident, with a restart to follow it, and nothing in this log
          # distinguishes that from an ordinary deploy (see infra/README.md
          # for the explicit warning to operators).
          #
          # What this DOES verify: that the previous step's `install` +
          # `daemon-reload` actually took effect and that the bytes that
          # landed on the droplet match the repo exactly -- catching
          # transport corruption (e.g. line-ending mangling) that a
          # successful exit code from the previous step would not. See task
          # #102 acceptance criterion 3.
          local_unit=$(cat infra/systemd/photoshowcase.service)
          # Keep "cannot reach the droplet" distinct from "the unit differs",
          # same reasoning as #99: a non-zero ssh exit means connectivity or
          # auth failed, not drift.
          if ! remote_unit=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat /etc/systemd/system/photoshowcase.service 2>/dev/null || echo __UNIT_ABSENT__'); then
            echo "Could not reach $DEPLOY_USER@$DEPLOY_HOST over SSH to verify the installed systemd unit."
            echo "This is a connectivity or auth failure, NOT unit drift."
            exit 1
          fi
          if [ "$remote_unit" = "__UNIT_ABSENT__" ]; then
            echo "photoshowcase.service is missing at /etc/systemd/system/ immediately after the install step -- that step did not actually take effect."
            exit 1
          fi
          if [ "$local_unit" != "$remote_unit" ]; then
            echo "photoshowcase.service on the droplet does not match infra/systemd/photoshowcase.service right after installing it."
            echo "This should not happen from this pipeline alone -- investigate before this deploy restarts the service."
            echo
            echo "diff (repo vs droplet):"
            diff <(printf '%s' "$local_unit") <(printf '%s' "$remote_unit") || true
            exit 1
          fi
          echo "photoshowcase.service on the droplet matches the repo."

      - name: Flip symlink + restart photoshowcase
        id: flip
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          PREV=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "readlink '$APP_ROOT/app/current' 2>/dev/null || true")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u photoshowcase ln -sfn '$APP_ROOT/app/releases/$GIT_SHA' '$APP_ROOT/app/current'
            sudo -n systemctl restart photoshowcase.service
          "

      - name: Health probe
        run: |
          set -eu
          # Probe the app on the droplet's loopback (127.0.0.1:3300) over SSH so
          # the gate works before the public edge (Cloudflare DNS + Caddy + apex
          # origin cert) is live. Switch to the public URL once that is up.
          for i in $(seq 1 15); do
            body=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
              'curl -fsS --max-time 5 http://127.0.0.1:3300/api/health' 2>/dev/null || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "health OK on attempt $i"
              echo "$body"
              exit 0
            fi
            echo "health $i/15: not ready (body: ${body:-<empty>})"
            sleep 3
          done
          echo "health check failed after 15 attempts"
          exit 1

      - name: Rollback on failure
        # Task #112: gating on `steps.flip.outputs.prev != ''` ALONE left
        # this step unreachable whenever "Install systemd unit" or "Verify
        # installed unit matches repo" failed -- `prev` is only ever set by
        # the "Flip symlink + restart" step's own run body, so if the job
        # never reaches Flip, that output stays unset and a GitHub Actions
        # expression reading an unset step output evaluates it as `''`,
        # making the old condition false. The result: the unit could be
        # installed and daemon-reload'd for the NEW release, and then the
        # job fails before the release ever flips, with nothing to undo it
        # -- exactly the unit/release skew #102's snapshot+restore
        # machinery was built to close, just unreachable in this one
        # window. `steps.<id>.outcome` is set by the Actions runtime itself
        # once a step has actually run, regardless of whether it succeeded,
        # so `steps.install-unit.outcome == 'failure'` / `steps.verify-unit
        # .outcome == 'failure'` cannot go missing the way a step's own
        # custom `echo … >> $GITHUB_OUTPUT` marker could if that step died
        # before reaching the line that sets it.
        if: failure() && (steps.flip.outputs.prev != '' || steps.install-unit.outcome == 'failure' || steps.verify-unit.outcome == 'failure')
        env:
          PREV: ${{ steps.flip.outputs.prev }}
        run: |
          set -eu
          # This step now runs for TWO distinct failure windows, and they
          # need different recovery actions -- read both before touching
          # this file, and keep this comment truthful (#102 review found
          # three false doc claims in this exact area; precision here is
          # load-bearing, not decoration):
          #
          # A. Flip already ran ($PREV non-empty): the release symlink was
          #    moved AND the service was already restarted onto the new
          #    release before something later failed (health probe, or
          #    anything else after "Flip symlink + restart"). Covered:
          #    restore the unit (best-effort) if it changed, flip the
          #    symlink back to $PREV, and restart -- a restart already
          #    happened once this run, so a second one to undo it is
          #    required, not optional. This is the original, pre-#112
          #    behaviour, unchanged.
          #
          # B. Flip never ran ($PREV empty, but "Install systemd unit" or
          #    "Verify installed unit matches repo" failed -- the #112
          #    window). Covered: the release symlink was never touched and
          #    the service was never restarted this run, so there is no
          #    release to flip back and no restart to undo. Restore the
          #    unit (best-effort) and daemon-reload again, so the loaded
          #    definition goes back to matching disk. Deliberately do NOT
          #    restart the service in this branch: it is still running
          #    whatever release and unit it started this run under,
          #    untouched by anything that happened here, and forcing an
          #    unprompted restart is not this step's job.
          #
          # NOT covered by either branch, still, after this fix:
          #  - A step failing BEFORE "Install systemd unit" (Upload
          #    tarball, Extract release, Run migrations, Seed portfolio
          #    content, Seed session packages) -- none of those touch the
          #    unit or the release symlink, so there is nothing here to
          #    roll back. The pre-existing, separately-accepted risk there
          #    is the database having moved ahead of the
          #    currently-running release; see "Install systemd unit"'s own
          #    comment on that trade -- this task does not change it.
          #  - A unit hand-edited on the droplet outside this pipeline --
          #    see "Verify installed unit matches repo"'s own caveat; this
          #    step only ever restores from the snapshot THIS run took,
          #    never from a hand-edit that predates it.
          #  - The coarse granularity of "Install systemd unit"'s combined
          #    `install` + `rm` + `daemon-reload` ssh command: it cannot
          #    distinguish "cp itself failed, nothing written" from "cp
          #    succeeded but daemon-reload didn't". Branch B treats both
          #    the same way (attempt a restore, best-effort) -- safe either
          #    way, but that specific partial-failure ordering has not been
          #    exercised against a real droplet, only reasoned about.
          #  - Real SSH/sudo/systemd failure modes in general: this fix
          #    was reproduced and mutation-proven with a local harness that
          #    mocks `ssh`/`scp` against a sandboxed filesystem, exercising
          #    this file's actual `run:` bodies and `if:` expression -- not
          #    against a live droplet or a real GitHub Actions runner. See
          #    task #112.
          restore_ok=1
          snapshot_existed=0
          # Set ONLY when "Install systemd unit"'s remote `cat` genuinely
          # returned the __UNIT_ABSENT__ sentinel -- the one case that
          # actually proves no unit was previously installed. A merely
          # missing-or-empty prev-unit-snapshot.txt (an earlier command in
          # that step failing first, or this snapshot ssh call itself
          # failing at the transport level -- the redirect still creates
          # the file before the command runs, so a failed `ssh` just
          # leaves it empty) says nothing about droplet history and must
          # NOT be reported as "first-ever install": that is precisely the
          # false-claim class this task exists to eliminate. See #112
          # review, round 2.
          snapshot_confirmed_absent=0
          if [ -s prev-unit-snapshot.txt ] && grep -q '^__UNIT_ABSENT__$' prev-unit-snapshot.txt; then
            snapshot_confirmed_absent=1
            echo "No previous unit snapshot to restore (first-ever install on this droplet)."
          elif [ -s prev-unit-snapshot.txt ]; then
            snapshot_existed=1
            scp -i ~/.ssh/deploy_key prev-unit-snapshot.txt \
              "$DEPLOY_USER@$DEPLOY_HOST:$UNIT_STAGING_DIR/photoshowcase.service" || restore_ok=0
            if [ "$restore_ok" = "1" ]; then
              ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
                set -eu
                sudo -n install -m 0644 -o root -g root '$UNIT_STAGING_DIR/photoshowcase.service' /etc/systemd/system/photoshowcase.service
                rm -f '$UNIT_STAGING_DIR/photoshowcase.service'
                sudo -n systemctl daemon-reload
              " || restore_ok=0
            fi
          else
            echo "No unit snapshot is available from this run (the snapshot step either never ran or failed at the transport level) -- this says nothing about whether a unit was previously installed."
          fi
          if [ "$restore_ok" = "0" ]; then
            echo "WARNING: could not restore the previous unit"
          fi

          if [ -n "$PREV" ]; then
            echo "rolling back release to $PREV"
            if [ "$restore_ok" = "0" ]; then
              echo "WARNING: continuing with the release rollback, which will restart under the NEW unit"
            fi
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
              set -eu
              sudo -n -u photoshowcase ln -sfn '$PREV' '$APP_ROOT/app/current'
              sudo -n systemctl restart photoshowcase.service
            "
          else
            # Four genuinely different outcomes for this branch's own unit
            # restore attempt above -- report each honestly rather than
            # asserting a cause the script never actually verified. Only
            # `snapshot_confirmed_absent` is a proven CAUSE (the sentinel
            # was genuinely read); the remaining "neither restored nor
            # confirmed absent" case gets CONCLUSION-based wording instead
            # of a guessed cause -- control flow proves nothing changed
            # (the overwrite commands are strictly sequential after the
            # snapshot line, so if the snapshot was never captured, none
            # of them ran either), it does not prove why the snapshot line
            # didn't produce a usable result. See #112 review, round 2.
            if [ "$snapshot_existed" = "1" ] && [ "$restore_ok" = "1" ]; then
              echo "Install/Verify failed before the flip -- no release symlink or restart to roll back. The unit WAS restored to its pre-deploy contents (see above); deliberately not restarting, since the service was never restarted this run either."
            elif [ "$snapshot_existed" = "1" ] && [ "$restore_ok" = "0" ]; then
              echo "Install/Verify failed before the flip -- no release symlink or restart to roll back. The unit restore ALSO failed (see WARNING above): the on-disk unit and/or loaded definition may still reflect this run's failed attempt -- investigate before the next deploy. Not restarting, since the service was never restarted this run either."
            elif [ "$snapshot_confirmed_absent" = "1" ]; then
              echo "Install/Verify failed before the flip -- no release symlink or restart to roll back. No previous unit snapshot existed (first-ever install on this droplet), so nothing needed restoring. Not restarting, since the service was never restarted this run either."
            else
              echo "Install/Verify failed before the flip -- no release symlink or restart to roll back. No unit change was made on this run to restore (either none was needed, or the snapshot could not be captured before the step failed) -- nothing to revert. Not restarting, since the service was never restarted this run either."
            fi
          fi

      - name: Prune old releases (keep 5)
        if: success()
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$APP_ROOT/app/releases'
            ls -1t | tail -n +6 | while read -r rel; do
              [ -n \"\$rel\" ] || continue
              sudo -n -u photoshowcase rm -rf \"\$rel\"
              echo \"pruned \$rel\"
            done
          "
