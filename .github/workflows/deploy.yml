name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to main)"
        required: false
        default: "main"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      APP_ROOT: /srv/photoshowcase

    steps:
      - name: Resolve target ref
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 1

      - name: Resolve SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone artifact
        run: bun run build

      - name: Package release tarball
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          STAGE=release-stage
          mkdir -p "$STAGE"
          cp -r .next/standalone/. "$STAGE"/
          mkdir -p "$STAGE/.next"
          cp -r .next/static "$STAGE/.next/static"
          if [ -d public ]; then cp -r public "$STAGE/public"; fi
          # drizzle-orm/postgres-js/migrator isn't traced by Next's standalone
          # output (no app code imports it), so overlay the full drizzle-orm and
          # postgres packages plus the migrate-prod script and the db module it
          # imports, preserving the dev layout so relative imports resolve.
          cp -r node_modules/drizzle-orm "$STAGE/node_modules/drizzle-orm"
          cp -r node_modules/postgres "$STAGE/node_modules/postgres"
          if [ -d drizzle ]; then cp -r drizzle "$STAGE/drizzle"; fi
          mkdir -p "$STAGE/scripts" "$STAGE/src/lib/db" "$STAGE/src/content"
          cp scripts/migrate-prod.ts "$STAGE/scripts/migrate-prod.ts"
          cp scripts/seed-prod.ts "$STAGE/scripts/seed-prod.ts"
          # Phase 2 ops scripts: staged so they reach the box with the release
          # instead of being scp'd by hand to /tmp. Both use the same relative
          # imports as seed-prod.ts, resolved against src/lib/db already
          # overlaid below.
          cp scripts/seed-packages.ts "$STAGE/scripts/seed-packages.ts"
          cp scripts/create-admin.ts "$STAGE/scripts/create-admin.ts"
          cp src/lib/db/index.ts "$STAGE/src/lib/db/index.ts"
          cp src/lib/db/schema.ts "$STAGE/src/lib/db/schema.ts"
          cp src/content/portfolio.ts "$STAGE/src/content/portfolio.ts"
          echo "$GIT_SHA" > "$STAGE/GIT_SHA"
          tar -czf release.tar.gz -C "$STAGE" .
          ls -lh release.tar.gz

      - name: Setup SSH
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify systemd unit matches droplet
        run: |
          set -eu
          # This pipeline never installs infra/systemd/photoshowcase.service —
          # that is a documented manual step (infra/README.md) because it
          # needs `sudo cp` to /etc/systemd/system/ + `daemon-reload`, and the
          # low-priv deploy user is not granted that (see the follow-up task
          # filed from #99 about closing this gap for real). Until then, "the
          # unit file changed in the repo" and "the unit file changed on the
          # droplet" are two different events, and a release that depends on
          # a new unit directive (CacheDirectory=, ExecStart flags, etc.)
          # without checking for that drift fails silently in production
          # instead of failing loud here. Reading the installed unit needs no
          # new grant: unit files under /etc/systemd/system are root:root
          # 644 by default, so a plain (non-sudo) read works for the deploy
          # user.
          local_unit=$(cat infra/systemd/photoshowcase.service)
          # Keep "cannot reach the droplet" distinct from "the unit differs".
          # The remote `cat` is forced to exit 0 (falling back to a sentinel
          # when the file is absent), so a non-zero exit from ssh itself can
          # only mean connectivity or auth failed. Without that split, an SSH
          # outage yields an empty remote unit and renders as a whole-file
          # diff — sending whoever is on call to run `sudo cp` against a box
          # they cannot even reach.
          if ! remote_unit=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat /etc/systemd/system/photoshowcase.service 2>/dev/null || echo __UNIT_ABSENT__'); then
            echo "Could not reach $DEPLOY_USER@$DEPLOY_HOST over SSH to read the installed systemd unit."
            echo "This is a connectivity or auth failure, NOT unit drift — do not run the install commands until the droplet is reachable."
            exit 1
          fi
          if [ "$remote_unit" = "__UNIT_ABSENT__" ]; then
            echo "photoshowcase.service is not installed at /etc/systemd/system/ on the droplet."
            echo "Install it, then re-run this deploy:"
            echo "  sudo cp infra/systemd/photoshowcase.service /etc/systemd/system/"
            echo "  sudo systemctl daemon-reload"
            exit 1
          fi
          if [ "$local_unit" != "$remote_unit" ]; then
            echo "photoshowcase.service on the droplet does not match infra/systemd/photoshowcase.service in this repo."
            echo "This pipeline does not install the unit automatically. Install it by hand first, then re-run this deploy:"
            echo "  sudo cp infra/systemd/photoshowcase.service /etc/systemd/system/"
            echo "  sudo systemctl daemon-reload"
            echo
            echo "diff (repo vs droplet):"
            diff <(printf '%s' "$local_unit") <(printf '%s' "$remote_unit") || true
            exit 1
          fi
          echo "photoshowcase.service on the droplet matches the repo."

      - name: Upload tarball
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/release-$GIT_SHA.tar.gz"

      - name: Extract release + write release.env
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          TARBALL="/tmp/release-$GIT_SHA.tar.gz"
          ENV_FILE="$RELEASE_DIR/release.env"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u photoshowcase install -d -m 0755 '$RELEASE_DIR'
            sudo -n -u photoshowcase tar -xzf '$TARBALL' -C '$RELEASE_DIR'
            rm -f '$TARBALL'
            printf 'GIT_SHA=%s\nAPP_ENV=production\n' '$GIT_SHA' | sudo -n -u photoshowcase tee '$ENV_FILE' >/dev/null
            sudo -n -u photoshowcase chmod 0640 '$ENV_FILE'
            # Next's image optimizer writes its on-disk cache under
            # <distDir>/cache (.next/cache) at runtime, but the release dir is
            # read-only to the running service by design (ProtectSystem=strict
            # in photoshowcase.service). Point .next/cache at the
            # systemd-managed CacheDirectory= (/var/cache/photoshowcase, which
            # IS writable under that hardening) instead of leaving it inside
            # the immutable release. Done here, at deploy time, because the
            # deploy user still has a normal writable view of the release dir
            # -- the sandbox only applies to the running photoshowcase.service
            # process, not to this extraction step. See task #99.
            sudo -n -u photoshowcase install -d -m 0755 '$RELEASE_DIR/.next'
            sudo -n -u photoshowcase ln -sfn /var/cache/photoshowcase '$RELEASE_DIR/.next/cache'
          "

      - name: Run migrations
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u photoshowcase /opt/bun/bin/bun scripts/migrate-prod.ts
          "

      - name: Seed portfolio content
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          # Idempotent full resync of portfolio tables from the committed manifest.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u photoshowcase /opt/bun/bin/bun scripts/seed-prod.ts
          "

      - name: Seed session packages
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          # Idempotent — matches on package name, so re-running only updates
          # prices/quotas. Safe to run on every deploy; existing galleries keep
          # their frozen snapshot regardless of what this changes.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u photoshowcase /opt/bun/bin/bun scripts/seed-packages.ts
          "

      - name: Flip symlink + restart photoshowcase
        id: flip
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          PREV=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "readlink '$APP_ROOT/app/current' 2>/dev/null || true")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u photoshowcase ln -sfn '$APP_ROOT/app/releases/$GIT_SHA' '$APP_ROOT/app/current'
            sudo -n systemctl restart photoshowcase.service
          "

      - name: Health probe
        run: |
          set -eu
          # Probe the app on the droplet's loopback (127.0.0.1:3300) over SSH so
          # the gate works before the public edge (Cloudflare DNS + Caddy + apex
          # origin cert) is live. Switch to the public URL once that is up.
          for i in $(seq 1 15); do
            body=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
              'curl -fsS --max-time 5 http://127.0.0.1:3300/api/health' 2>/dev/null || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "health OK on attempt $i"
              echo "$body"
              exit 0
            fi
            echo "health $i/15: not ready (body: ${body:-<empty>})"
            sleep 3
          done
          echo "health check failed after 15 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.flip.outputs.prev != ''
        env:
          PREV: ${{ steps.flip.outputs.prev }}
        run: |
          set -eu
          echo "rolling back to $PREV"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u photoshowcase ln -sfn '$PREV' '$APP_ROOT/app/current'
            sudo -n systemctl restart photoshowcase.service
          "

      - name: Prune old releases (keep 5)
        if: success()
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$APP_ROOT/app/releases'
            ls -1t | tail -n +6 | while read -r rel; do
              [ -n \"\$rel\" ] || continue
              sudo -n -u photoshowcase rm -rf \"\$rel\"
              echo \"pruned \$rel\"
            done
          "
