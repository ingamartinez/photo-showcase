name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (defaults to main)"
        required: false
        default: "main"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      APP_ROOT: /srv/photoshowcase

    steps:
      - name: Resolve target ref
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 1

      - name: Resolve SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone artifact
        run: bun run build

      - name: Package release tarball
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          STAGE=release-stage
          mkdir -p "$STAGE"
          cp -r .next/standalone/. "$STAGE"/
          mkdir -p "$STAGE/.next"
          cp -r .next/static "$STAGE/.next/static"
          if [ -d public ]; then cp -r public "$STAGE/public"; fi
          # Next's standalone tracing only emits a package under
          # node_modules/ for code paths reachable from an app ROUTE; it
          # inlines/tree-shakes the rest into the compiled `.next/server`
          # chunks, so it never leaves a real, `require`-able package
          # directory behind for something else to reuse. Any bare npm
          # import used ONLY by a script (or by a src/lib/ module a script
          # pulls in) therefore needs its package hand-overlaid here, same as
          # the app's own route bundles do not help it. Confirmed hand-overlaid
          # so far, and why each is needed:
          #   - drizzle-orm, postgres: scripts/migrate-prod.ts is the only
          #     caller of drizzle-orm/postgres-js/migrator anywhere in the
          #     codebase; no route reaches that import path.
          #   - zod (task #104 review, blocker 1): src/lib/env.ts imports it
          #     directly, and every route that reaches env.ts does so through
          #     Next's bundler, which inlines zod rather than leaving it as a
          #     package -- so the FIRST time anything needs a real,
          #     `require`-able `zod` package on disk is a raw script run via
          #     plain `bun run`. Verified on the real droplet:
          #     node_modules there is exactly client-only, detect-libc,
          #     drizzle-orm, @img, @next, next, postgres, react, react-dom,
          #     semver, sharp, styled-jsx, @swc -- no zod, and no ancestor
          #     node_modules to fall back to either (this is a plain release
          #     dir, not a workspace). Without this line,
          #     backfill-display-derivatives.ts, check-r2.ts and
          #     check-resend.ts (all three import ../src/lib/env) die on
          #     import with "Cannot find package 'zod'".
          # This list is NOT self-maintaining the way scripts/ and src/lib/
          # below are -- a new script that imports a new bare npm package
          # needs a new line here. The "Verify ops script import graphs
          # resolve in the staged tarball" step further below exists
          # precisely to catch the day someone forgets, by actually trying to
          # resolve every ops script's import graph against this staged
          # output rather than trusting this comment block to stay accurate.
          cp -r node_modules/drizzle-orm "$STAGE/node_modules/drizzle-orm"
          cp -r node_modules/postgres "$STAGE/node_modules/postgres"
          cp -r node_modules/zod "$STAGE/node_modules/zod"
          if [ -d drizzle ]; then cp -r drizzle "$STAGE/drizzle"; fi
          # Ops scripts (task #104, fixing the class, not the instance): task
          # #104 found backfill-display-derivatives.ts invisible to this step,
          # because scripts were staged by an explicit allowlist -- one `cp`
          # per file -- and a new script needed a new line nobody remembered
          # to add. Adding that one line would only have fixed THIS script;
          # the next one dropped into scripts/ hits the identical gap. So:
          # overlay `scripts/` and `src/lib/` WHOLESALE instead of naming
          # files one by one. Every script committed under scripts/ now
          # reaches the droplet by construction, and so does every src/lib/
          # module it imports (the file-PRESENCE half of the gap #104 hit --
          # see the node_modules block above for the import-RESOLUTION half,
          # which presence alone does not cover, and which is exactly what
          # broke review round 1 of this task: scripts/ and src/lib/ were
          # both fully present and it still failed on a missing `zod`).
          #
          # rsync's --exclude, not `cp` + a separate `find -delete`: the
          # earlier shape copied every test file first and deleted them
          # afterward as a silent, easy-to-forget second step. Excluding at
          # copy time means a test file is never staged in the first place;
          # the assertion below is the loud backstop in case a future test
          # file naming convention (`*.spec.ts`, `*.test.tsx`, ...) isn't
          # covered by these patterns yet.
          rsync -a --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude='*.spec.tsx' \
            scripts/ "$STAGE/scripts/"
          mkdir -p "$STAGE/src"
          rsync -a --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude='*.spec.tsx' \
            src/lib/ "$STAGE/src/lib/"
          leaked_test_files=$(find "$STAGE/scripts" "$STAGE/src/lib" -type f \
            \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \))
          if [ -n "$leaked_test_files" ]; then
            echo "Test file(s) leaked into the staged release despite rsync's --exclude filters -- refusing to ship:"
            echo "$leaked_test_files"
            exit 1
          fi
          # r2.ts (pulled in by backfill-display-derivatives.ts) imports
          # src/lib/env.ts through the `@/` alias, unlike every other
          # overlaid module here, which uses relative imports. Bun resolves
          # `@/*` from tsconfig.json's `paths` at runtime the same way it
          # does under `bun dev` -- verified against this exact staged
          # layout: an identical `bun run` fails with "Cannot find module
          # '@/lib/env'" without this file, and resolves correctly with it.
          # The release dir had no tsconfig.json before now, so this import
          # would have failed on the droplet at runtime, not here at deploy
          # time -- the open question task #104 was asked to close before
          # shipping this script.
          cp tsconfig.json "$STAGE/tsconfig.json"
          mkdir -p "$STAGE/src/content"
          cp src/content/portfolio.ts "$STAGE/src/content/portfolio.ts"
          echo "$GIT_SHA" > "$STAGE/GIT_SHA"
          tar -czf release.tar.gz -C "$STAGE" .
          ls -lh release.tar.gz

      - name: Verify ops script import graphs resolve in the staged tarball
        run: |
          set -eu
          STAGE=release-stage
          # task #104 review, item 4: file PRESENCE (the rsync overlay above)
          # is necessary but not sufficient -- an ops script can be fully
          # present, under a fully present scripts/ and src/lib/, and still
          # fail at import time if a bare npm package somewhere in its
          # transitive graph was never traced by Next AND never hand-overlaid
          # above. That is exactly what shipped broken in review round 1:
          # `zod` was missing and nothing caught it before the droplet did.
          # File-presence and import-resolution are complementary checks,
          # not alternatives -- this step is the second one, and it is what
          # actually makes "a new script under scripts/ cannot silently fail
          # to reach the droplet" (task #104's acceptance criterion) true.
          #
          # For every package.json script whose command touches `scripts/`,
          # resolve its FULL import graph using `bun build`. `bun build`
          # performs the same module resolution `bun run` would without
          # executing a single line of the script's top-level code --
          # several of these scripts do real work (DB writes, R2 writes,
          # seeding) the instant they are imported, so actually running them
          # here is not an option.
          #
          # Resolved against an EXTRACTION of release.tar.gz in a mktemp dir
          # OUTSIDE $GITHUB_WORKSPACE, not against `$STAGE` in place -- round
          # 2 review, blocker 2: `$STAGE` (release-stage/) lives inside this
          # job's own checkout, right next to the `node_modules` that
          # `bun install` populated two steps ago (a FULL install, superset
          # of what the tarball ships). Bun's module resolution walks
          # upward from wherever `bun build` runs, so `cd release-stage &&
          # bun build ...` climbs past release-stage/node_modules (missing
          # zod, say) straight into the checkout's own node_modules (has
          # zod) and reports success -- mutation-proved: deleting zod from
          # $STAGE alone and re-running the OLD (in-place) form of this
          # check still printed "resolve cleanly" and exited 0. The literal
          # bug this step exists to catch, undetected by the step meant to
          # catch it, for the identical "a real node_modules is reachable
          # by walking up from where bun resolves" reason as round 1's
          # `zod` gap itself and round 2's first (contaminated) local
          # simulation of this very check. Extracting the actual tarball
          # into a directory with no ancestor `node_modules` removes that
          # escape hatch, and has the added benefit of verifying what
          # actually SHIPS (the tarball), not what was staged before
          # tar'ing it up.
          #
          # NOT covered by this or any static check: a script that reaches
          # a bare package only through a runtime-conditional
          # `require()`/dynamic `import()` rather than a static import --
          # `bun build`'s resolution is static. Nothing under scripts/ does
          # that today; if one ever does, this step's silence on that one
          # import is a known, accepted gap, not a guarantee.
          mapfile -t ops_scripts < <(jq -r '.scripts[]' package.json | grep -oE 'scripts/[A-Za-z0-9_.-]+\.ts' | sort -u)
          if [ "${#ops_scripts[@]}" -eq 0 ]; then
            echo "No package.json script references scripts/*.ts -- this check would have nothing to verify, which is itself a surprise worth failing loudly on rather than silently passing."
            exit 1
          fi
          resolve_root="$(mktemp -d)"
          tar -xzf release.tar.gz -C "$resolve_root"
          resolve_out="$(mktemp -d)"
          failed=0
          for rel in "${ops_scripts[@]}"; do
            if [ ! -f "$STAGE/$rel" ]; then
              echo "MISSING: package.json references $rel but it is not staged at $STAGE/$rel"
              failed=1
              continue
            fi
            echo "resolving $rel ..."
            if ! (cd "$resolve_root" && bun build "$rel" --target=bun --outdir="$resolve_out"); then
              echo "IMPORT GRAPH BROKEN: $rel would fail to even import on the droplet -- see the bun build error above. Overlay the missing package's node_modules folder in the 'Package release tarball' step."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All ops scripts referenced by package.json resolve cleanly against the extracted release tarball."

      - name: Setup SSH
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify systemd unit matches droplet
        run: |
          set -eu
          # This pipeline never installs infra/systemd/photoshowcase.service —
          # that is a documented manual step (infra/README.md) because it
          # needs `sudo cp` to /etc/systemd/system/ + `daemon-reload`, and the
          # low-priv deploy user is not granted that (see the follow-up task
          # filed from #99 about closing this gap for real). Until then, "the
          # unit file changed in the repo" and "the unit file changed on the
          # droplet" are two different events, and a release that depends on
          # a new unit directive (CacheDirectory=, ExecStart flags, etc.)
          # without checking for that drift fails silently in production
          # instead of failing loud here. Reading the installed unit needs no
          # new grant: unit files under /etc/systemd/system are root:root
          # 644 by default, so a plain (non-sudo) read works for the deploy
          # user.
          local_unit=$(cat infra/systemd/photoshowcase.service)
          # Keep "cannot reach the droplet" distinct from "the unit differs".
          # The remote `cat` is forced to exit 0 (falling back to a sentinel
          # when the file is absent), so a non-zero exit from ssh itself can
          # only mean connectivity or auth failed. Without that split, an SSH
          # outage yields an empty remote unit and renders as a whole-file
          # diff — sending whoever is on call to run `sudo cp` against a box
          # they cannot even reach.
          if ! remote_unit=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat /etc/systemd/system/photoshowcase.service 2>/dev/null || echo __UNIT_ABSENT__'); then
            echo "Could not reach $DEPLOY_USER@$DEPLOY_HOST over SSH to read the installed systemd unit."
            echo "This is a connectivity or auth failure, NOT unit drift — do not run the install commands until the droplet is reachable."
            exit 1
          fi
          if [ "$remote_unit" = "__UNIT_ABSENT__" ]; then
            echo "photoshowcase.service is not installed at /etc/systemd/system/ on the droplet."
            echo "Install it, then re-run this deploy:"
            echo "  sudo cp infra/systemd/photoshowcase.service /etc/systemd/system/"
            echo "  sudo systemctl daemon-reload"
            exit 1
          fi
          if [ "$local_unit" != "$remote_unit" ]; then
            echo "photoshowcase.service on the droplet does not match infra/systemd/photoshowcase.service in this repo."
            echo "This pipeline does not install the unit automatically. Install it by hand first, then re-run this deploy:"
            echo "  sudo cp infra/systemd/photoshowcase.service /etc/systemd/system/"
            echo "  sudo systemctl daemon-reload"
            echo
            echo "diff (repo vs droplet):"
            diff <(printf '%s' "$local_unit") <(printf '%s' "$remote_unit") || true
            exit 1
          fi
          echo "photoshowcase.service on the droplet matches the repo."

      - name: Upload tarball
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/release-$GIT_SHA.tar.gz"

      - name: Extract release + write release.env
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          TARBALL="/tmp/release-$GIT_SHA.tar.gz"
          ENV_FILE="$RELEASE_DIR/release.env"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u photoshowcase install -d -m 0755 '$RELEASE_DIR'
            sudo -n -u photoshowcase tar -xzf '$TARBALL' -C '$RELEASE_DIR'
            rm -f '$TARBALL'
            printf 'GIT_SHA=%s\nAPP_ENV=production\n' '$GIT_SHA' | sudo -n -u photoshowcase tee '$ENV_FILE' >/dev/null
            sudo -n -u photoshowcase chmod 0640 '$ENV_FILE'
            # Next's image optimizer writes its on-disk cache under
            # <distDir>/cache (.next/cache) at runtime, but the release dir is
            # read-only to the running service by design (ProtectSystem=strict
            # in photoshowcase.service). Point .next/cache at the
            # systemd-managed CacheDirectory= (/var/cache/photoshowcase, which
            # IS writable under that hardening) instead of leaving it inside
            # the immutable release. Done here, at deploy time, because the
            # deploy user still has a normal writable view of the release dir
            # -- the sandbox only applies to the running photoshowcase.service
            # process, not to this extraction step. See task #99.
            sudo -n -u photoshowcase install -d -m 0755 '$RELEASE_DIR/.next'
            sudo -n -u photoshowcase ln -sfn /var/cache/photoshowcase '$RELEASE_DIR/.next/cache'
          "

      - name: Run migrations
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u photoshowcase /opt/bun/bin/bun scripts/migrate-prod.ts
          "

      - name: Seed portfolio content
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          # Idempotent full resync of portfolio tables from the committed manifest.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u photoshowcase /opt/bun/bin/bun scripts/seed-prod.ts
          "

      - name: Seed session packages
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          RELEASE_DIR="$APP_ROOT/app/releases/$GIT_SHA"
          # Idempotent — matches on package name, so re-running only updates
          # prices/quotas. Safe to run on every deploy; existing galleries keep
          # their frozen snapshot regardless of what this changes.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$RELEASE_DIR'
            sudo -n -u photoshowcase /opt/bun/bin/bun scripts/seed-packages.ts
          "

      - name: Flip symlink + restart photoshowcase
        id: flip
        env:
          GIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -eu
          PREV=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "readlink '$APP_ROOT/app/current' 2>/dev/null || true")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u photoshowcase ln -sfn '$APP_ROOT/app/releases/$GIT_SHA' '$APP_ROOT/app/current'
            sudo -n systemctl restart photoshowcase.service
          "

      - name: Health probe
        run: |
          set -eu
          # Probe the app on the droplet's loopback (127.0.0.1:3300) over SSH so
          # the gate works before the public edge (Cloudflare DNS + Caddy + apex
          # origin cert) is live. Switch to the public URL once that is up.
          for i in $(seq 1 15); do
            body=$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
              'curl -fsS --max-time 5 http://127.0.0.1:3300/api/health' 2>/dev/null || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "health OK on attempt $i"
              echo "$body"
              exit 0
            fi
            echo "health $i/15: not ready (body: ${body:-<empty>})"
            sleep 3
          done
          echo "health check failed after 15 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.flip.outputs.prev != ''
        env:
          PREV: ${{ steps.flip.outputs.prev }}
        run: |
          set -eu
          echo "rolling back to $PREV"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            sudo -n -u photoshowcase ln -sfn '$PREV' '$APP_ROOT/app/current'
            sudo -n systemctl restart photoshowcase.service
          "

      - name: Prune old releases (keep 5)
        if: success()
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -eu
            cd '$APP_ROOT/app/releases'
            ls -1t | tail -n +6 | while read -r rel; do
              [ -n \"\$rel\" ] || continue
              sudo -n -u photoshowcase rm -rf \"\$rel\"
              echo \"pruned \$rel\"
            done
          "
